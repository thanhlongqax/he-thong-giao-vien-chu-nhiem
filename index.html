<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hệ thống quản lý lớp học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <section id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="login-art">
        <div>
          <img class="brand-logo" src="assets/logo.svg" alt="Logo hệ thống quản lý lớp học" />
          <h1>Hệ thống quản lý lớp học</h1>
          <p>Quản lý lớp chủ nhiệm, theo dõi sinh viên và hỗ trợ học tập trên một nền tảng thống nhất.</p>
        </div>
      </div>
      <div class="login-form">
        <h2>Đăng nhập</h2>
        <p class="sub">Nhập tài khoản được cấp. Hệ thống tự nhận vai trò.</p>
        <div class="role-pills">
          <button class="active" data-role="auto" type="button">Tự nhận</button>
          <button data-role="gv" type="button">Giáo viên</button>
          <button data-role="sv" type="button">Sinh viên</button>
          <button data-role="ad" type="button">Quản trị</button>
        </div>
        <p class="form-error" id="loginErr">Tài khoản hoặc mật khẩu không đúng</p>
        <div class="field">
          <label>Tài khoản / MSSV</label>
          <input id="loginUser" autocomplete="username" />
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <div class="pw-wrap">
            <input id="loginPass" type="password" autocomplete="current-password" />
            <button class="pw-toggle" type="button" onclick="togglePw('loginPass', this)" aria-label="Hiện mật khẩu"></button>
          </div>
        </div>
        <button class="btn btn-primary full" id="btnLogin" type="button">Đăng nhập</button>
      </div>
    </div>
  </section>

  <div id="app" class="shell app-hidden">
    <div class="mobile-bar">
      <button class="icon-btn" id="btnMenu" type="button" aria-label="Menu">☰</button>
      <span style="display:flex;align-items:center;gap:8px">
        <img class="logo-img" src="assets/logo.svg" alt="" width="28" height="28" style="width:28px;height:28px;border-radius:8px;background:#fff" />
        <b id="mobileTitle">Hệ thống quản lý lớp học</b>
      </span>
      <span style="width:36px"></span>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this) hideModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/migration.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/classes.js"></script>
  <script src="js/views/students.js"></script>
  <script src="js/views/attendance.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/schedule.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/leaves.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/student.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
