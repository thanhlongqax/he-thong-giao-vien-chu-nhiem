<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hệ thống quản lý lớp học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <section id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="login-art">
        <div>
          <div class="brand-mark">QLLH</div>
          <h1>Hệ thống quản lý lớp học</h1>
          <p>Quản lý lớp chủ nhiệm, theo dõi sinh viên và hỗ trợ học tập trên một nền tảng thống nhất.</p>
        </div>
      </div>
      <div class="login-form">
        <h2>Đăng nhập</h2>
        <p class="sub">Chọn vai trò và nhập tài khoản được cấp.</p>
        <div class="role-pills">
          <button class="active" data-role="gv" type="button">Giáo viên</button>
          <button data-role="sv" type="button">Sinh viên</button>
          <button data-role="ad" type="button">Quản trị</button>
        </div>
        <div class="field">
          <label>Tài khoản / MSSV</label>
          <input id="loginUser" autocomplete="username" />
        </div>
        <div class="field">
          <label>Mật khẩu</label>
          <div class="pw-wrap">
            <input id="loginPass" type="password" autocomplete="current-password" />
            <button class="pw-toggle" type="button" onclick="togglePw('loginPass', this)">Hiện</button>
          </div>
        </div>
        <button class="btn btn-primary full" id="btnLogin" type="button">Đăng nhập</button>
      </div>
    </div>
  </section>

  <div id="app" class="shell app-hidden">
    <div class="mobile-bar">
      <button class="icon-btn" id="btnMenu" type="button" aria-label="Menu">☰</button>
      <b id="mobileTitle">Hệ thống quản lý lớp học</b>
      <span style="width:36px"></span>
    </div>
    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this) hideModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
